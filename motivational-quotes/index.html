<script>
const QUOTES=[{"quote":"Momentum does not ask for confidence. It asks for a first move.","author":"Calm Down Quotes original","meaning":"You do not need to feel fully ready before progress can begin. Action often creates the confidence you were waiting for.","instruction":"Choose one task you have been delaying and work on it for ten focused minutes.","category":"Starting & Momentum","tags":["original","action","momentum","confidence"]},{"quote":"A difficult day can still contain one decision you are proud of.","author":"Calm Down Quotes original","meaning":"A day does not have to go perfectly to count. One deliberate choice can change how you finish it.","instruction":"Make one decision today that your future self would respect.","category":"Resilience & Grit","tags":["original","resilience","choice","progress"]},{"quote":"You build self-belief by keeping promises no one else can see.","author":"Calm Down Quotes original","meaning":"Confidence grows when your private behaviour begins matching the standards you set for yourself.","instruction":"Complete one small promise you made to yourself before doing anything optional.","category":"Discipline & Habits","tags":["original","discipline","self-belief","integrity"]},{"quote":"Do not wait for the whole path to become obvious. Earn the next metre.","author":"Calm Down Quotes original","meaning":"Clarity often arrives through movement rather than planning every possible outcome in advance.","instruction":"Identify the next useful action, not the entire plan, and complete it.","category":"Starting & Momentum","tags":["original","clarity","action","progress"]},{"quote":"Your standards shape your future long before your results reveal it.","author":"Calm Down Quotes original","meaning":"The quality you accept from yourself today quietly becomes the baseline for tomorrow.","instruction":"Raise the standard on one routine you usually do carelessly.","category":"Character & Integrity","tags":["original","standards","future","discipline"]},{"quote":"The version of you that you want is trained in ordinary hours.","author":"Calm Down Quotes original","meaning":"Transformation is built mostly in unremarkable moments when nobody is watching.","instruction":"Use one ordinary hour today as deliberate practice for the person you want to become.","category":"Identity & Direction","tags":["original","identity","training","consistency"]},{"quote":"Progress becomes powerful when it stops depending on your mood.","author":"Calm Down Quotes original","meaning":"Reliable routines protect your goals from the natural rise and fall of motivation.","instruction":"Choose one important habit and give it a fixed minimum you can complete even on a low-energy day.","category":"Discipline & Habits","tags":["original","habits","consistency","motivation"]},{"quote":"You do not need a dramatic comeback. You need a useful next day.","author":"Calm Down Quotes original","meaning":"Recovery does not require a perfect reset. It begins by making tomorrow slightly better than today.","instruction":"Write down the first three actions that would make tomorrow a better day and prepare one of them now.","category":"Resilience & Grit","tags":["original","comeback","reset","progress"]},{"quote":"Fear becomes smaller when it has to compete with a clear reason.","author":"Calm Down Quotes original","meaning":"A strong purpose can make discomfort feel worth carrying instead of something that must disappear first.","instruction":"Write one sentence explaining why the thing you are avoiding matters to you.","category":"Courage & Fear","tags":["original","fear","purpose","courage"]},{"quote":"Make your future easier by being slightly stronger today.","author":"Calm Down Quotes original","meaning":"Small acts of preparation reduce future stress and increase your options.","instruction":"Do one task now that removes friction from tomorrow.","category":"Preparation & Opportunity","tags":["original","preparation","future","strength"]},{"quote":"A setback is information before it becomes a verdict.","author":"Calm Down Quotes original","meaning":"Failure can teach you what needs to change if you examine it before judging yourself by it.","instruction":"Write down what one recent setback taught you about your plan, skill or preparation.","category":"Learning & Growth","tags":["original","setback","learning","growth"]},{"quote":"You can be tired and still be moving in the right direction.","author":"Calm Down Quotes original","meaning":"Fatigue does not automatically mean you are failing. Sometimes it means the pace needs adjusting, not the destination.","instruction":"Reduce one task to a sustainable version and keep the streak alive.","category":"Hard Times","tags":["original","fatigue","direction","sustainability"]},{"quote":"The smallest disciplined action is stronger than the biggest intention.","author":"Calm Down Quotes original","meaning":"Intentions have value only when they cross into behaviour, however small the first step is.","instruction":"Turn one intention into a visible action before the next hour ends.","category":"Action Over Words","tags":["original","discipline","action","intention"]},{"quote":"Stop measuring your beginning against someone else’s middle.","author":"Calm Down Quotes original","meaning":"Comparison distorts progress because you rarely see the years of work behind another person’s current position.","instruction":"Compare yourself only with where you were one month ago and note one improvement.","category":"Perspective & Mindset","tags":["original","comparison","progress","mindset"]},{"quote":"Some doors only appear after you have walked far enough to see them.","author":"Calm Down Quotes original","meaning":"Opportunity is often invisible from the starting point and becomes available only after sustained movement.","instruction":"Keep moving on one uncertain goal for one more deliberate week before judging its potential.","category":"Preparation & Opportunity","tags":["original","opportunity","persistence","movement"]},{"quote":"You do not find your limits by thinking about them.","author":"Calm Down Quotes original","meaning":"Your assumed limits are often guesses until effort gives you real evidence.","instruction":"Test one belief about what you cannot do with a controlled attempt today.","category":"Self-Belief","tags":["original","limits","belief","effort"]},{"quote":"The goal is not to feel unstoppable. It is to become hard to stop.","author":"Calm Down Quotes original","meaning":"Durability comes from systems and persistence, not from permanently high motivation.","instruction":"Strengthen one routine so it still works when your enthusiasm is low.","category":"Resilience & Grit","tags":["original","durability","systems","persistence"]},{"quote":"Your attention is a budget. Spend it where you want growth.","author":"Calm Down Quotes original","meaning":"What repeatedly receives your focus tends to improve, while neglected priorities remain intentions.","instruction":"Protect thirty distraction-free minutes for the priority that matters most today.","category":"Focus & Direction","tags":["original","attention","focus","growth"]},{"quote":"A quiet hour of real work can beat a loud week of planning.","author":"Calm Down Quotes original","meaning":"Planning is useful until it becomes a substitute for producing something tangible.","instruction":"Set a timer for one hour and create, solve or complete rather than plan.","category":"Action Over Words","tags":["original","work","planning","execution"]},{"quote":"Do not confuse slow progress with no progress.","author":"Calm Down Quotes original","meaning":"Many worthwhile changes are difficult to notice day to day even while they are accumulating.","instruction":"Look back ninety days and list three things that have improved, however slightly.","category":"Patience & Process","tags":["original","patience","progress","perspective"]},{"quote":"Your next level may require fewer excuses, not more information.","author":"Calm Down Quotes original","meaning":"There is a point where learning more stops helping and action becomes the missing ingredient.","instruction":"Choose one area where you already know enough and act on what you know.","category":"Motivation & Action","tags":["original","action","excuses","growth"]},{"quote":"The right direction matters more than impressive speed.","author":"Calm Down Quotes original","meaning":"Moving quickly toward the wrong target wastes more energy than moving steadily toward the right one.","instruction":"Check whether your busiest task actually serves your most important goal.","category":"Focus & Direction","tags":["original","direction","speed","priority"]},{"quote":"Confidence is evidence you collect about yourself.","author":"Calm Down Quotes original","meaning":"Belief becomes stronger when it is supported by repeated proof that you can act, learn and recover.","instruction":"Do one thing today that gives you fresh evidence you can trust yourself.","category":"Self-Belief","tags":["original","confidence","evidence","trust"]},{"quote":"A goal becomes real when your calendar starts paying for it.","author":"Calm Down Quotes original","meaning":"Priorities that never receive scheduled time rarely survive competing demands.","instruction":"Put a specific block of time for your most important goal into your calendar.","category":"Goals & Direction","tags":["original","goals","calendar","priority"]}];
const next=document.getElementById("next"),quote=document.getElementById("quote"),author=document.getElementById("author"),meaning=document.getElementById("meaning"),instruction=document.getElementById("instruction"),category=document.getElementById("category"),feedback=document.getElementById("feedback");
let order=[],at=0;
function shuffle(){order=Array.from({length:QUOTES.length},(_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}at=0}
function show(){if(!order.length||at>=order.length)shuffle();const q=QUOTES[order[at++]];quote.textContent=`“${q.quote}”`;author.textContent=q.author;meaning.textContent=q.meaning;instruction.textContent=q.instruction;category.textContent=q.category;next.textContent="Give Me Another Motivational Quote";feedback.textContent="";try{localStorage.setItem("motivation_last",String(order[at-1]))}catch{}if(typeof gtag==="function")gtag("event","quote_generated",{page_id:"motivation",category:q.category})}
function shareText(){return `${quote.textContent}\n${author.textContent}\n\nMeaning: ${meaning.textContent}\n\nAction: ${instruction.textContent}\n\nhttps://calm-down-quotes.github.io/motivational-quotes/`}
document.getElementById("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(shareText());feedback.textContent="Copied."}catch{feedback.textContent="Copy is not available on this device."}});
document.getElementById("share").addEventListener("click",async()=>{const text=shareText();if(navigator.share){try{await navigator.share({title:"Motivational Quote",text,url:"https://calm-down-quotes.github.io/motivational-quotes/"})}catch(e){if(e.name!=="AbortError")feedback.textContent="Share was not available."}}else{try{await navigator.clipboard.writeText(text);feedback.textContent="Share text copied."}catch{feedback.textContent="Sharing is not available on this device."}}});
next.addEventListener("click",show);shuffle();show();
</script>
